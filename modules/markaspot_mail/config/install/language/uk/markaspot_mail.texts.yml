  preheader: 'Про цю проблему вже повідомили.'
  status_note: 'Закрито як дублікат. Робота над проблемою продовжується в межах звернення #@request_id.'
  private_status_note: 'Закрито як дублікат. Про цю проблему вже повідомили, і робота продовжується в межах попереднього звернення.'
