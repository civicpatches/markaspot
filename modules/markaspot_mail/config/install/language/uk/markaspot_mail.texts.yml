langcode: uk
report_confirmation:
  subject: 'Ваше звернення #[node:request_id] отримано'
  headline: 'Ми отримали Ваше звернення'
  intro: 'Ваше звернення #[node:request_id] зареєстровано.'
  body_blocks:
    - 'Категорія: [node:field_category:entity:name]'
    - '[node:initial_status_note]'
  cta_label: 'Переглянути звернення'
  preheader: 'Ми отримали Ваше звернення і триматимемо Вас у курсі.'
status_open:
  subject: 'Оновлення щодо звернення #[node:request_id]'
  headline: 'Ваше звернення опрацьовується'
  intro: 'Дякуємо за Ваше звернення. Його передано відповідальному підрозділу, і зараз воно опрацьовується.'
  body_blocks:
    - 'Щойно питання буде вирішено, Ви отримаєте нове сповіщення.'
  cta_label: 'Переглянути звернення'
  preheader: 'Ваше звернення зараз опрацьовується.'
status_closed:
  subject: 'Ваше звернення #[node:request_id] вирішено'
  headline: 'Ваше звернення вирішено'
  intro: 'Гарна новина! Ваше звернення #[node:request_id] вирішено.'
  body_blocks:
    - 'У разі надзвичайної ситуації або безпосередньої небезпеки негайно зверніться до місцевих екстрених служб.'
  cta_label: 'Переглянути звернення'
  preheader: 'Ваше звернення вирішено.'
status_not_responsible:
  subject: 'Ваше звернення #[node:request_id]: поза нашою компетенцією'
  headline: 'Це звернення не належить до нашої компетенції'
  intro: 'Ваше звернення #[node:request_id] розглянуто. На жаль, цей тип звернень не належить до нашої компетенції.'
  body_blocks:
    - 'У разі надзвичайної ситуації або безпосередньої небезпеки негайно зверніться до місцевих екстрених служб.'
  cta_label: 'Переглянути звернення'
  preheader: 'Це звернення не належить до нашої компетенції.'

status_duplicate:
  subject: '{{ citizen_term_singular_title }} #[node:request_id]: закриття дубліката'
