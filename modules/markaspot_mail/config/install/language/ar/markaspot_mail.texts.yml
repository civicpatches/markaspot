langcode: ar
report_confirmation:
  subject: 'تم استلام بلاغك رقم ‎#[node:request_id]'
  headline: 'لقد استلمنا بلاغك'
  intro: 'تم تسجيل بلاغك رقم ‎#[node:request_id].'
  body_blocks:
    - 'الفئة: [node:field_category:entity:name]'
    - '[node:initial_status_note]'
