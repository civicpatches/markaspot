  preheader: 'لقد استلمنا بلاغك وسنبقيك على اطلاع.'
status_open:
  subject: 'تحديث بشأن بلاغك رقم ‎#[node:request_id]'
  headline: 'بلاغك قيد المعالجة'
  intro: 'شكرًا على بلاغك. تمت إحالته إلى الجهة المختصة وهو الآن قيد المعالجة.'
  body_blocks:
    - 'ستصلك إشعارات أخرى عند حل المشكلة.'
  cta_label: 'عرض بلاغك'
  preheader: 'بلاغك الآن قيد المعالجة.'
status_closed:
  subject: 'تم حل بلاغك رقم ‎#[node:request_id]'
  headline: 'تم حل بلاغك'
  intro: 'خبر سار! تم حل بلاغك رقم ‎#[node:request_id].'
  body_blocks:
    - 'في حالة الطوارئ العاجلة أو الخطر المباشر، يرجى الاتصال مباشرة بخدمات الطوارئ المحلية.'
  cta_label: 'عرض بلاغك'
  preheader: 'تم حل بلاغك.'
status_not_responsible:
  subject: 'بلاغك رقم ‎#[node:request_id]: خارج نطاق اختصاصنا'
  headline: 'هذا البلاغ خارج نطاق اختصاصنا'
  intro: 'تمت مراجعة بلاغك رقم ‎#[node:request_id]. للأسف، هذا النوع من الطلبات خارج نطاق اختصاصنا.'
  body_blocks:
    - 'في حالة الطوارئ العاجلة أو الخطر المباشر، يرجى الاتصال مباشرة بخدمات الطوارئ المحلية.'
  cta_label: 'عرض بلاغك'
  preheader: 'هذا البلاغ خارج نطاق اختصاصنا.'

status_duplicate:
  subject: '{{ citizen_term_singular_title }} #[node:request_id]: إغلاق بسبب التكرار'
  headline: 'سبق الإبلاغ عن هذه المشكلة'
  intro: '{{ citizen_term_singular_title }} #[node:request_id]: سبق الإبلاغ عن هذه المشكلة. تستمر المتابعة في البلاغ الموجود.'
  cta_label: 'عرض البلاغ الموجود'
  preheader: 'سبق الإبلاغ عن هذه المشكلة.'
  status_note: 'إغلاق بسبب التكرار. تستمر متابعة المشكلة ضمن البلاغ #@request_id.'
  private_status_note: 'إغلاق بسبب التكرار. سبق الإبلاغ عن هذه المشكلة وتستمر المتابعة في البلاغ الموجود.'
  body_blocks:
    - '[node:latest_status_note]'
