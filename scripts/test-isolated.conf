# shellcheck shell=bash
# shellcheck disable=SC2034
# Trusted Bash settings read by test-isolated.sh (copied unchanged from beantragt).
# The runner mounts this profile checkout at PROJECT_PREFIX inside a Drupal site
# whose vendor and core come read-only from --vendor (a Composer site with this
# profile installed, e.g. the dev site). COMPOSER_LOCK must be that site's lock.
PHP_IMAGE=ddev/ddev-webserver:v1.24.10@sha256:1cd0474e2f1b7d4eac284e5a5eadd6d0583959238ab08585d63c7398f858d22a
PHP_BIN=/usr/bin/php8.4
DB_IMAGE=mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
DOCROOT=web
PROJECT_PREFIX=web/profiles/contrib/markaspot
PHPUNIT_CONFIG="$PROJECT_PREFIX/phpunit.xml.dist"
TEST_WORKDIR=web
COMPOSER_LOCK=${ISOLATED_COMPOSER_LOCK:?Set ISOLATED_COMPOSER_LOCK to the composer.lock of the --vendor site}
DEPENDENCY_PATHS=(web/core web/modules/contrib web/themes/contrib web/index.php web/autoload.php web/autoload_runtime.php web/.ht.router.php)
OPTIONAL_DEPENDENCY_PATHS=(web/libraries)
DEFAULT_GROUPS= # All groups and ungrouped tests of phpunit.xml.dist.
